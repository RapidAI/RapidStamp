# PP-OCRv5 mobile rec finetune on seal strips.
# max_text_length is 48 because Paddle seal labels run to 40 characters.
# The NRTR positional table is re-initialized at that length; the CTC head
# still loads from the official pretrained weights.
Global:
  model_name: PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 6
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: /home/mayong/rapidstamp/ppocr_ft/output
  save_epoch_step: 1
  eval_batch_step: [0, 400]
  cal_metric_during_train: true
  pretrained_model: /home/mayong/rapidstamp/ppocr_ft/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints:
  save_inference_dir: /home/mayong/rapidstamp/ppocr_ft/inference
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: /home/mayong/rapidstamp/ppocr_ft/ppocrv5_dict.txt
  max_text_length: &max_text_length 48
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /home/mayong/rapidstamp/ppocr_ft/output/predicts.txt
  d2s_train_image_shape: [3, 48, 576]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /
    label_file_list:
      - /home/mayong/rapidstamp/ppocr_ft/train_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 576]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /
    label_file_list:
      - /home/mayong/rapidstamp/ppocr_ft/val_list.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 576]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
